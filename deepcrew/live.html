        r.tr.replaceChildren(h('td', { class: 'ex' }, icon('chev')), h('td', { class: 'num' }, t.id), h('td', { class: 'ttl' }, t.title),
          h('td', {}, t.owner ? h('span', { class: 'own' }, h('i'), t.owner) : '—'), h('td', {}, h('span', { class: 'mo-state s-' + t.state }, h('i'), STATE[t.state] || t.state)),
          h('td', { class: 'scope', title: (t.scope || []).join('\n') }, (t.scope || []).join(', ') || '—'), h('td', {}, wait));
        const said = [t.description, t.summary ? 'Done: ' + t.summary : '', (t.blocks || []).length ? 'Holds up ' + t.blocks.map(tid).join(', ') : ''].filter(Boolean).join('\n');
        r.more.firstChild.replaceChildren(said || t.title);
      }
      r.ageS = ask ? ask.age_s : null;
      if (r.ageEl) setText(r.ageEl, age(since(r.ageS)));
      r.more.hidden = !s.open.has(t.id);
      kids.push(r.tr, r.more);
    }
    for (const [id, r] of s.rows) if (!seen.has(id)) { s.rows.delete(id); s.open.delete(id); }
    if (kids.length !== tbody.children.length || kids.some((e, i) => tbody.children[i] !== e)) tbody.replaceChildren(...kids);
  }
  setInterval(() => { if (!el.hidden && !document.hidden) for (const r of s.rows.values()) if (r.ageEl) setText(r.ageEl, age(since(r.ageS))); }, 1000);
  function flashRow(id, color) {
    const r = s.rows.get(String(id)); if (!r || still()) return;
    r.tr.style.setProperty('--hit', color); r.tr.classList.remove('flash'); void r.tr.offsetWidth; r.tr.classList.add('flash');
    clearTimeout(r.flashTimer); r.flashTimer = setTimeout(() => r.tr.classList.remove('flash'), 2000);
  }

  function paintFolders(snap) {
    const bad = new Set(snap.conflicts.map((x) => x.path));
    overlaps.hidden = !snap.conflicts.length; setText(overlaps, snap.conflicts.length); foldB.classList.toggle('bad', snap.conflicts.length > 0);
    foldB.title = ['Who may write where', ...snap.conflicts.map((x) => (x.task ? tid(x.task) + ' ' : '') + x.path + ': ' + x.reason)].join('\n');
    const sig = JSON.stringify([snap.members.map((m) => [m.name, m.region]), [...bad]]);
    if (folders.dataset.sig === sig) return;
    folders.dataset.sig = sig;
    folders.replaceChildren(...snap.members.map((m) => h('div', { style: `--mc:${mcolor(m.name)}` }, h('b', {}, m.name),
      ...[...(m.region.length ? m.region : []), `notes/${m.name}-*`, `artifacts/${m.name}/`].map((p) => h('span', { class: 'lv-chip' + (bad.has(p) ? ' hot' : '') }, p)))));
  }

  const COLOUR = { post: 'var(--g-flow)', claim: 'var(--g-flow)', done: 'var(--st-done)', mail: 'var(--g-mail)', edit: 'var(--g-edit)', note: 'var(--g-edit)',
    perm: 'var(--warn)', question: 'var(--warn)', member_state: 'var(--muted)' };
  const node = (id) => who(String(id || '').replace(/^m:/, '').replace(/^board$/, 'all'));
  const said = (e) => (e.kind === 'mail' && e.gist ? `${node(e.from)} → ${node(e.to)}: ${e.gist}` : e.label);
  function paintLog() {
    const n = s.log.length;
    act.meta.replaceChildren(h('b', { class: 'mo-n' }, n)); act.el.title = n ? 'Latest: ' + said(s.log[0]) : '';
    logEl.replaceChildren(...s.log.map((e) => h('li', { title: e.label }, h('i', { style: `--c:${COLOUR[e.kind] || 'var(--muted)'}` }), h('time', {}, hm(e.ts)), h('span', {}, said(e)))));
  }
  function paintDecisions(snap) {
    const d = snap.decisions || [];
    dec.meta.replaceChildren(h('b', { class: 'mo-n' }, d.length));
    const sig = JSON.stringify(d.slice(0, 20));
    if (decEl.dataset.sig === sig) return;
    decEl.dataset.sig = sig;
    decEl.replaceChildren(...d.slice(0, 20).map((x) => h('li', { title: (x.member ? x.member + ': ' : '') + (x.what || '') },
      h('i', { style: `--c:${x.state === 'denied' || x.state === 'expired' ? 'var(--bad)' : 'var(--good)'}` }), h('time', {}, hm(x.ts)), h('span', {}, [x.by, x.what, x.state].filter(Boolean).join(': ')))));
  }
  function paintCost(snap) {
    const b = snap.budget || {}, max = Math.max(1e-9, ...snap.members.map((m) => m.cost_usd || 0));
    costTank.set(b.usd ? (b.spent || 0) / b.usd : b.spent ? 0.08 : 0);
    cost.meta.replaceChildren(costTank.el, h('b', {}, usd(b.spent))); cost.el.title = (b.usd ? `${usd(b.spent)} of ${usd(b.usd)}` : usd(b.spent)) + (snap.provider ? ', ' + snap.provider : '');
    costEl.classList.toggle('dense', snap.members.length > 12);
    const seen = new Set();
    snap.members.forEach((m, i) => {
      let li = s.costs.get(m.name);
      if (!li) {
        const f = new DiverFig({ color: mcolor(m.name), size: 1, state: 'calm' }); f.el.classList.remove('fl');
        li = h('li', { class: 'mo-cm' }, f.el, h('span', { class: 'nm' }), h('span', { class: 'v' }), bar().el);
        li.fig = f; s.costs.set(m.name, li);
      }
      seen.add(m.name);
      li.style.setProperty('--mc', mcolor(m.name));
      const [, nm, v, b_] = li.children, u = m.usage || {};
      nm.replaceChildren(...[m.name, u.running ? h('i', { class: 'run' }) : null].filter(Boolean)); setText(v, usd(m.cost_usd));
      b_.firstChild.style.width = (clamp((m.cost_usd || 0) / max, 0, 1) * 100).toFixed(1) + '%';
      li.title = `${m.name}: ${u.requests || 0} requests`;
      li.fig.set(u.running ? 'work' : 'calm');
      place(costEl, li, i);
    });
    for (const [k, li] of s.costs) if (!seen.has(k)) { li.remove(); s.costs.delete(k); }
  }

  function nodeOf(id) {
    if (id === 'user') return userCard;
    if (id === 'leader') return leadEl;
    if (id === 'board' || id === 'all') return bbEl;
    const t = s.tiles.get(String(id).replace(/^m:/, '')); return t ? t.el : null;
  }
  const MOVES = { claim: ['from', 'look'], done: ['from', 'done'], release: ['from', 'look'], pass: ['from', 'look'], edit: ['from', 'work'], note: ['from', 'work'], perm: ['from', 'work'],
    question: ['from', 'work'], mail: ['to', 'mail'] };
  function onEvents(evs) {
    if (el.hidden || document.hidden) return;
    evs.forEach((ev, i) => {
      const delay = Math.min(i, 10) * 110, [end, play] = MOVES[ev.kind] || [], t = end && s.tiles.get(String(ev[end] || '').replace(/^m:/, ''));
      if (t) setTimeout(() => t.fig.play(play), end === 'to' ? delay + 900 : delay);
      if (ev.task != null) flashRow(ev.task, COLOUR[ev.kind] || 'var(--g-flow)');
      if (ev.kind === 'member_state' || ev.kind === 'edit' || ev.kind === 'note' || ev.from === ev.to) return;
      const kind = ev.kind === 'done' ? 'done' : ev.kind === 'post' || ev.kind === 'claim' ? 'post' : ev.kind === 'perm' || ev.kind === 'question' ? (ev.state === 'pending' ? 'ask' : 'say') : ev.from === 'user' ? 'say' : 'mail';
      const color = ev.kind === 'claim' ? mcolor(String(ev.to).replace(/^m:/, '')) : COLOUR[ev.kind] || 'var(--g-mail)';
      fxl.fly(nodeOf(ev.from), nodeOf(ev.to), kind, color, delay);
      setTimeout(() => lightWires(ev.from, ev.to, color), delay);
      if (ev.kind === 'done' && t) { const p = fxl.centreOf(t.el); setTimeout(() => fxl.burst(p, mcolor(ev.member)), delay + 200); }
    });
  }
  on('avatar', () => youFig.dress(st.avatar));

  function paint() {
    const snap = s.snap;
    if (!snap || el.hidden) return;
    nobody.hidden = !!snap.team; card.hidden = panes.hidden = !snap.team;
    if (!snap.team) return;
    const c = snap.counts;
    const total = Math.max(1, c.open + c.claimed + c.done);
    stack.done.style.width = (100 * c.done / total) + '%'; stack.work.style.width = (100 * c.claimed / total) + '%'; stack.open.style.width = (100 * c.open / total) + '%';
    stackEl.title = `${c.done} done, ${c.claimed} at work, ${c.open} waiting`;
    paintFolders(snap); paintCrew(snap); paintTable(snap); paintDecisions(snap); paintCost(snap);
  }
  return {
    el,
    data(snap, events, reset) {
      if (reset) s.log.length = 0;
      s.snap = snap;
      for (const ev of events) if (ev.label) s.log.unshift(ev);
      s.log.splice(30);
      paint(); if (!el.hidden) paintLog();
      onEvents(events);
    },
    paint() { paint(); paintLog(); }, conn() {},
    reset() { s.snap = null; s.log.length = 0; },
    pane,
  };
})();

addTab('settings', 'Settings', 'gear');
addTab('call', 'Team Call', 'call');
addTab('monitor', 'Monitor', 'graph');
window.deepcrewLive = {
  addTab, show, connect, on,
  push(block) { onBlock(block); },
  setActions(fn) { st.actions = fn; },
  get snap() { return st.snap; }, get source() { return st.source; },
  views, aside, icon, h, tank, bar, Figure, Desk,
};
const chosen = !!(location.hash.slice(1) || store.get('deepcrew-ui-tab'));
let opened = false;
on('snapshot', ({ snap }) => {
  if (opened) return;
  opened = true;
  if (!snap.team && shown !== 'settings' && !location.hash.slice(1)) show('settings', true);
  else if (snap.team && !chosen) show('call', true);
});
st.gen = 1;
show(chosen ? wanted() : 'settings', true);
stream(st.gen);
})();
</script>
